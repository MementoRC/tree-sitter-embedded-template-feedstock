context:
  name: tree-sitter-embedded-template
  version: "0.25.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/tree-sitter/tree-sitter-embedded-template/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c45330d6c53b64c9dfbcb00e85ddb5b3f79e0f3457bc76ca764c57630ee4df54
  # Source missing file tree_sitter/parser.h
  # url: https://pypi.org/packages/source/t/tree-sitter-embedded-template/tree_sitter_embedded_template-${{ version }}.tar.gz
  # sha256: 7b24dcf2e92497f54323e617564d36866230a8bfb719dbb7b45b461510dcddaa

build:
  script:
    - |
      # This package builds a py_limited_api (abi3) extension. setuptools names the
      # shared object from the first '.abi3' entry of the BUILD interpreter's
      # importlib.machinery.EXTENSION_SUFFIXES (see get_abi3_suffix() in
      # setuptools/command/build_ext.py). CPython 3.15 (gh-122931) inserted a
      # platform-tagged '.abi3-<multiarch>.so' ahead of the plain '.abi3.so', so on a
      # cross build the BUILD arch leaks into the filename and the module cannot be
      # imported on the host. EXT_SUFFIX and SETUPTOOLS_EXT_SUFFIX do not govern this
      # path. crossenv >=1.6.0 patches EXTENSION_SUFFIXES, but cross-python currently
      # pulls in crossenv 1.5.0, which does not; drop this once
      # https://github.com/conda-forge/crossenv-feedstock/pull/49 lands.
      # The object itself is correct target-arch code -- built by the cross compiler
      # and packaged into a correctly tagged wheel -- so only the name needs fixing.
      if [[ "${CONDA_BUILD_CROSS_COMPILATION:-0}" == "1" ]]; then
        _sysconf_py=$(ls "${PREFIX}"/lib/python*/_sysconfigdata_*.py 2>/dev/null | head -n1)
        if [[ -n "${_sysconf_py}" ]]; then
          _host_abi3=$(_SYSCONF_PY="${_sysconf_py}" python -c 'import os, runpy; v = runpy.run_path(os.environ["_SYSCONF_PY"])["build_time_vars"]; ma = v.get("MULTIARCH") or ""; print(".abi3-%s.so" % ma if ma else ".abi3.so")')
          echo "cross-build: host abi3 suffix=${_host_abi3}"
        else
          echo "cross-build: WARNING no host _sysconfigdata_*.py found under ${PREFIX}"
        fi
      fi
      ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-build-isolation -vv
      if [[ "${CONDA_BUILD_CROSS_COMPILATION:-0}" == "1" && -n "${_host_abi3:-}" ]]; then
        for _f in "${PREFIX}"/lib/python*/site-packages/tree_sitter_embedded_template/_binding.abi3*.so; do
          [[ -e "${_f}" ]] || continue
          _want="$(dirname "${_f}")/_binding${_host_abi3}"
          if [[ "${_f}" != "${_want}" ]]; then
            echo "cross-build: renaming $(basename "${_f}") -> $(basename "${_want}")"
            mv -f "${_f}" "${_want}"
          fi
        done
      fi
  number: 3

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: target_platform != build_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - pip
    - python
    - setuptools >=42
  run:
    - python

tests:
  - python:
      imports:
        - tree_sitter_embedded_template
      pip_check: true
  - script:
      - python -m pytest bindings/python/tests/
    requirements:
      run:
        - pytest
        - python
        - tree_sitter
    files:
      source:
        - bindings/python/tests/

about:
  homepage: https://github.com/tree-sitter/tree-sitter-embedded-template
  summary: 'A tree-sitter parser for templating languages like ERB and EJS.'
  description: |
    A tree-sitter parser for templating languages like ERB and EJS,
    in which scripting code can be embedded within text content using
    the delimiters <% and %>
  license: MIT
  license_file: LICENSE
  repository: https://github.com/tree-sitter/tree-sitter-embedded-template

extra:
  recipe-maintainers:
    - MementoRC
